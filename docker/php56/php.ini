; Phase 0 baseline PHP settings for the legacy PHP 5.6 container.
; Kept close to production behaviour; the app's .htaccess may override memory_limit
; and max_input_vars per-request via mod_php.

date.timezone = Asia/Kolkata

memory_limit = 1024M
max_input_vars = 10000

upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- opcache: big speedup for Yii, which includes many PHP files per request ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
